<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Dashboard</title>
    <meta name="shopify-api-key" content="c0a04c94fc7ebeba911fbd434da8bd4d" />
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #202223; 
            padding: 16px;
            min-height: 100vh;
        }
        .container {
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .header { 
            background: linear-gradient(135deg, #1d4ed8 0%, #7c3aed 100%);
            color: white;
            padding: 24px; 
            border-radius: 12px; 
            margin-bottom: 24px; 
            text-align: center;
        }
        .title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { opacity: 0.9; font-size: 16px; margin-bottom: 16px; }
        .connection-status { 
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 8px;
            border: 2px solid transparent;
        }
        .status-connected { 
            background: white; 
            color: #15803d; 
            border-color: #15803d;
            box-shadow: 0 2px 8px rgba(21, 128, 61, 0.2);
        }
        .status-error { 
            background: white; 
            color: #dc2626; 
            border-color: #dc2626;
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.2);
        }
        .status-loading { 
            background: white; 
            color: #2563eb; 
            border-color: #2563eb;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2);
        }
        
        .controls { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 24px; 
            justify-content: center;
        }
        .refresh-btn, .export-btn { 
            padding: 12px 24px; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s;
            font-size: 14px;
        }
        .refresh-btn { 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
            color: white; 
        }
        .export-btn { 
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%); 
            color: white; 
        }
        
        /* COMPACT CARDS */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 12px; 
            margin-bottom: 20px; 
        }
        .card { 
            background: white; 
            padding: 14px; 
            border-radius: 10px; 
            text-align: center; 
            border: 1px solid #e2e8f0; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .label { 
            font-size: 11px; 
            color: #64748b; 
            font-weight: 600; 
            margin-bottom: 6px; 
            text-transform: uppercase; 
        }
        .value { 
            font-size: 18px; 
            font-weight: 700; 
            color: #1e293b; 
            margin-bottom: 4px; 
            word-break: break-word;
        }
        .badge { 
            background: #e0e7ff; 
            color: #3730a3; 
            padding: 3px 6px; 
            border-radius: 10px; 
            font-size: 9px; 
            font-weight: 600; 
        }
        
        /* PRODUCT CARDS */
        .products-section { margin-top: 32px; }
        .products-title { 
            font-size: 24px; 
            font-weight: 700; 
            color: #1e293b; 
            margin-bottom: 20px; 
            text-align: center;
        }
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 16px; 
        }
        .product-card { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid #e2e8f0; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: relative;
        }
        .product-header {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 12px;
        }
        .product-info {
            flex: 1;
            min-width: 0;
        }
        .product-actions {
            margin-bottom: 12px;
        }
        .product-actions select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 12px;
            background: white;
            cursor: pointer;
        }
        .product-image {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            object-fit: cover;
        }
        .product-title {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 4px;
            line-height: 1.2;
        }
        .product-vendor {
            font-size: 10px;
            color: #64748b;
        }
        .product-metrics {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }
        .product-metrics.collapsed {
            max-height: 85px;
            overflow: hidden;
            position: relative;
            transition: max-height 0.3s ease;
        }
        .product-metrics.expanded {
            max-height: 1000px;
            transition: max-height 0.3s ease;
        }
        .product-metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            padding: 6px 8px;
            background: #f8fafc;
            border-radius: 6px;
            min-width: 0; /* Allow shrinking */
            overflow: hidden; /* Prevent overflow */
            gap: 8px;
        }
        .product-metric span:first-child {
            color: #64748b;
            font-weight: 500;
            white-space: normal;
            word-wrap: break-word;
            line-height: 1.3;
            flex-shrink: 0;
            margin-right: 8px;
            min-width: 120px;
        }
        .product-metric span:last-child {
            color: #1e293b;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: right;
            flex-shrink: 1;
            min-width: 0;
        }
        
        /* Enhanced inline editing styles with blue-magenta gradient */
        .product-metrics-detailed {
            background: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 50%, #f3e8ff 100%);
            border: 1px solid #a5b4fc;
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
        }
        
        .metric-with-inputs {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            transition: all 0.2s ease;
            min-height: 44px;
        }
        
        .metric-with-inputs:hover {
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.15);
        }
        
        .metric-with-inputs span:first-child {
            color: #1e40af;
            font-weight: 600;
            font-size: 12px;
            white-space: normal;
            word-wrap: break-word;
            line-height: 1.3;
            flex: 1;
            min-width: 0;
            margin-right: 8px;
        }
        
        .metric-inputs {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        
        .metric-input {
            width: 50px;
            padding: 4px 6px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            background: white;
            transition: all 0.2s ease;
        }
        
        .metric-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: #fefefe;
        }
        
        .metric-type-select {
            width: 35px;
            padding: 4px 2px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .metric-type-select:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }
        
        .metric-calculated-value {
            font-weight: 700;
            color: #1e40af;
            min-width: 60px;
            text-align: right;
            font-size: 11px;
            padding: 4px 6px;
            background: linear-gradient(135deg, #f0f9ff 0%, #faf5ff 100%);
            border-radius: 6px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            flex-shrink: 0;
        }
        .suggested-price {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 2px solid #bae6fd;
            border-radius: 10px;
            padding: 12px;
            margin-top: 8px;
        }
        .suggested-price.price-match {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border-color: #86efac;
        }
        .suggested-price-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .suggested-price-value {
            font-size: 16px;
            font-weight: 700;
        }
        .update-price-btn {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }
        .update-price-btn:hover {
            background: #2563eb;
        }
        .update-price-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .update-price-btn.updating {
            background: #fbbf24;
        }
        .update-price-btn.success {
            background: #10b981;
        }
        .update-price-btn.error {
            background: #ef4444;
        }
        .price-match-indicator {
            color: #059669;
            text-align: center;
            font-weight: 600;
            font-size: 12px;
            padding: 6px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 6px;
        }
        
        .toggle-metrics-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 12px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .toggle-metrics-btn:hover {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }
        .toggle-metrics-btn.expanded {
            background: linear-gradient(135deg, #1e40af 0%, #6d28d9 100%);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.2);
            transform: translateY(0);
        }
        .product-metrics.collapsed::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: linear-gradient(transparent, white);
            pointer-events: none;
        }
        .product-metrics.expanded::after {
            display: none;
        }
        .product-metrics-essential {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }
        .product-metrics-detailed {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
            margin-top: 12px;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }
            .product-grid { 
                grid-template-columns: 1fr; 
                gap: 12px;
            }
            .product-metrics { 
                gap: 4px;
            }
            .product-metrics-essential { 
                gap: 4px;
            }
            .product-metrics-detailed { 
                gap: 4px;
            }
            .product-card {
                padding: 16px;
            }
            .product-header {
                align-items: flex-start;
                gap: 8px;
            }
            .product-info {
                width: 100%;
            }
            .product-actions {
                width: 100%;
            }
            .product-actions select {
                width: 100%;
                font-size: 14px;
                padding: 8px;
            }
            .card {
                padding: 12px;
            }
            .value {
                font-size: 16px;
            }
            .product-metric {
                font-size: 11px;
                padding: 8px;
            }
            .product-metric span:first-child {
                min-width: 100px;
                font-size: 10px;
                white-space: normal;
                word-wrap: break-word;
                line-height: 1.2;
            }
            .product-metric span:last-child {
                font-size: 11px;
                font-weight: 700;
            }
            
            /* Responsive metric inputs for tablets */
            .metric-with-inputs {
                gap: 6px;
                padding: 6px 10px;
                min-height: 40px;
            }
            .metric-with-inputs span:first-child {
                font-size: 11px;
            }
            .metric-input {
                width: 45px;
                padding: 3px 4px;
                font-size: 10px;
            }
            .metric-type-select {
                width: 32px;
                padding: 3px 1px;
                font-size: 9px;
            }
            .metric-calculated-value {
                min-width: 55px;
                font-size: 10px;
                padding: 3px 4px;
            }
        }
        
        /* Responsive styles for metric inputs */
        @media (max-width: 1024px) {
            .metric-with-inputs {
                gap: 6px;
                padding: 6px 10px;
            }
            .metric-input {
                width: 45px;
                padding: 3px 4px;
                font-size: 10px;
            }
            .metric-type-select {
                width: 32px;
                padding: 3px 1px;
                font-size: 9px;
            }
            .metric-calculated-value {
                min-width: 50px;
                font-size: 10px;
                padding: 3px 4px;
            }
        }
        
        @media (max-width: 768px) {
            .metric-with-inputs {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                padding: 8px;
            }
            .metric-with-inputs span:first-child {
                font-size: 11px;
                margin-right: 0;
                margin-bottom: 4px;
                text-align: center;
            }
            .metric-inputs {
                justify-content: center;
                gap: 8px;
            }
            .metric-input {
                width: 60px;
                padding: 6px;
                font-size: 12px;
            }
            .metric-type-select {
                width: 45px;
                padding: 6px 4px;
                font-size: 11px;
            }
            .metric-calculated-value {
                text-align: center;
                min-width: auto;
                font-size: 12px;
                padding: 6px;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 8px;
            }
            .product-card {
                padding: 12px;
            }
            .header {
                padding: 16px;
            }
            .title {
                font-size: 24px;
            }
            .subtitle {
                font-size: 14px;
            }
            .controls {
                flex-direction: column;
                gap: 8px;
            }
            .refresh-btn, .export-btn {
                width: 100%;
            }
            .grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            
            .metric-with-inputs {
                padding: 6px;
                gap: 6px;
            }
            .metric-with-inputs span:first-child {
                font-size: 10px;
            }
            .metric-input {
                width: 50px;
                padding: 4px;
                font-size: 11px;
            }
            .metric-type-select {
                width: 40px;
                padding: 4px 2px;
                font-size: 10px;
            }
            .metric-calculated-value {
                font-size: 11px;
                padding: 4px;
            }
        }
        
        .price-suggestion {
            color: #64748b;
            font-size: 12px;
            text-align: center;
            padding: 6px;
            background: rgba(100, 116, 139, 0.1);
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">📊 Nest Finance Calculator</div>
            <div class="subtitle">Real-time financial metrics for your Shopify store</div>
            <div style="font-size: 12px; color: #64748b; margin-top: 4px; font-weight: 500;">
                Created by Island Tech Experts
            </div>
            <div class="connection-status" id="connectionStatus">
                <span id="statusText">🔄 Connecting to Shopify...</span>
            </div>
        </div>
        
        <div class="controls">
            <button class="refresh-btn" id="refreshBtn" onclick="refreshShopifyData()">
                🔄 Sync Shopify Data
            </button>
            <button class="export-btn" onclick="exportDataFixed()">
                📊 Export Report
            </button>
            <button class="save-settings-btn" onclick="saveSettingsForFuture()" style="
                background: #10b981; 
                color: white; 
                border: none; 
                padding: 10px 20px; 
                border-radius: 8px; 
                font-weight: 600;
                cursor: pointer;
                font-size: 14px;
                transition: all 0.2s;
                margin-left: 8px;
            " onmouseover="this.style.background='#059669'" onmouseout="this.style.background='#10b981'">
                💾 Save Settings for Future
            </button>
            <button class="reset-btn" onclick="resetAllProductRates()" style="
                background: #ef4444; 
                color: white; 
                border: none; 
                padding: 10px 20px; 
                border-radius: 8px; 
                font-weight: 600;
                cursor: pointer;
                font-size: 14px;
                transition: all 0.2s;
                margin-left: 8px;
            " onmouseover="this.style.background='#dc2626'" onmouseout="this.style.background='#ef4444'">
                🗑️ Reset All to Zero
            </button>
            <button class="clear-btn" onclick="clearAllSavedSettings()" style="
                background: #f59e0b; 
                color: white; 
                border: none; 
                padding: 10px 20px; 
                border-radius: 8px; 
                font-weight: 600;
                cursor: pointer;
                font-size: 14px;
                transition: all 0.2s;
                margin-left: 8px;
            " onmouseover="this.style.background='#d97706'" onmouseout="this.style.background='#f59e0b'">
                🧹 Clear All Saved Data
            </button>
        </div>
        
        <!-- Comprehensive Financial Overview -->
        <div class="grid" id="metricsGrid"></div>
        
        <!-- Tax and Duty Breakdown -->
        <div class="card">
            <h3 style="margin-bottom: 16px; color: #1e293b; font-size: 18px;">🏛️ Tax & Duty Breakdown</h3>
            <div class="grid" id="taxGrid"></div>
        </div>
        
        <!-- Fees & Charges Breakdown -->
        <div class="card">
            <h3 style="margin-bottom: 16px; color: #1e293b; font-size: 18px;">💼 Fees & Charges</h3>
            <div class="grid" id="feesGrid"></div>
        </div>
        
        <!-- Freight & Logistics -->
        <div class="card">
            <h3 style="margin-bottom: 16px; color: #1e293b; font-size: 18px;">🚛 Freight & Logistics</h3>
            <div class="grid" id="freightGrid"></div>
        </div>
        
        <!-- Advanced Financial Calculations -->
        <div class="card">
            <h3 style="margin-bottom: 16px; color: #1e293b; font-size: 18px;">📈 Revenue After Losses</h3>
            <div class="grid" id="advancedGrid"></div>
        </div>
        
        <div class="products-section">
            <div class="products-title">📦 Product Analysis</div>
            <!-- Search Bar -->
            <div style="margin-bottom: 20px; max-width: 400px; margin-left: auto; margin-right: auto;">
                <input 
                    type="text" 
                    id="productSearch" 
                    placeholder="🔍 Search products by name, vendor, or ID..."
                    style="
                        width: 100%;
                        padding: 12px 16px;
                        border: 2px solid #e2e8f0;
                        border-radius: 10px;
                        font-size: 14px;
                        font-family: inherit;
                        background: white;
                        transition: all 0.2s;
                        outline: none;
                    "
                    onkeyup="searchProducts(this.value)"
                    onfocus="this.style.borderColor='#3b82f6'"
                    onblur="this.style.borderColor='#e2e8f0'"
                >
            </div>
            <div class="product-grid" id="productGrid"></div>
        </div>
    </div>
    
    <script>
        // Custom Notification System - No more annoying browser alerts!
        function showNotification(message, type = 'success', duration = 4000) {
            // Remove existing notifications
            const existingNotifications = document.querySelectorAll('.custom-notification');
            existingNotifications.forEach(notif => notif.remove());
            
            const notification = document.createElement('div');
            notification.className = 'custom-notification';
            
            // Style based on type
            let bgColor, textColor, icon;
            switch(type) {
                case 'success':
                    bgColor = '#10b981';
                    textColor = 'white';
                    icon = '✅';
                    break;
                case 'error':
                    bgColor = '#ef4444';
                    textColor = 'white';
                    icon = '⚠️';
                    break;
                case 'warning':
                    bgColor = '#f59e0b';
                    textColor = 'white';
                    icon = '💡';
                    break;
                case 'info':
                    bgColor = '#3b82f6';
                    textColor = 'white';
                    icon = 'ℹ️';
                    break;
                default:
                    bgColor = '#6b7280';
                    textColor = 'white';
                    icon = '📢';
            }
            
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: ${bgColor};
                color: ${textColor};
                padding: 16px 24px;
                border-radius: 12px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.2);
                z-index: 10000;
                font-family: inherit;
                font-size: 14px;
                font-weight: 600;
                max-width: 400px;
                word-wrap: break-word;
                transform: translateX(100%);
                transition: all 0.3s ease;
                cursor: pointer;
            `;
            
            notification.innerHTML = `${icon} ${message}`;
            
            // Add to page
            document.body.appendChild(notification);
            
            // Animate in
            setTimeout(() => {
                notification.style.transform = 'translateX(0)';
            }, 10);
            
            // Auto remove
            setTimeout(() => {
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.remove();
                    }
                }, 300);
            }, duration);
            
            // Click to dismiss
            notification.addEventListener('click', () => {
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.remove();
                    }
                }, 300);
            });

            const grossRevenue = data.grossRevenue || 0;
            const costOfGoods = data.costOfGoods || 0;
            
            // Ensure all rate values are valid numbers, default to 0 if NaN
            const usTax = rateTypes.usTax === 'percentage' ? 
                grossRevenue * ((taxRates.usTax || 0) / 100) : (taxRates.usTax || 0);
            const bahamasTax = rateTypes.bahamasTax === 'percentage' ? 
                grossRevenue * ((taxRates.bahamasTax || 0) / 100) : (taxRates.bahamasTax || 0);
            const usCustoms = rateTypes.customsRate === 'percentage' ? 
                grossRevenue * ((taxRates.customsRate || 0) / 100) : (taxRates.customsRate || 0);
            const bahamasCustoms = rateTypes.bahamasCustoms === 'percentage' ? 
                grossRevenue * ((taxRates.bahamasCustoms || 0) / 100) : (taxRates.bahamasCustoms || 0);
            const bahamasEnvironmentalDuty = rateTypes.bahamasEnvironmentalDuty === 'percentage' ? 
                grossRevenue * ((taxRates.bahamasEnvironmentalDuty || 0) / 100) : (taxRates.bahamasEnvironmentalDuty || 0);
                
            const warehouseFeeOverall = rateTypes.warehouseFeeRate === 'percentage' ? 
                grossRevenue * ((taxRates.warehouseFeeRate || 0) / 100) : (taxRates.warehouseFeeRate || 0);
            const warehouseReceiverFee = rateTypes.warehouseReceiverFee === 'percentage' ? 
                grossRevenue * ((taxRates.warehouseReceiverFee || 0) / 100) : (taxRates.warehouseReceiverFee || 0);
            const brokerFees = rateTypes.brokerFees === 'percentage' ? 
                grossRevenue * ((taxRates.brokerFees || 0) / 100) : (taxRates.brokerFees || 0);
            const buyersClubFee = rateTypes.buyersClubFee === 'percentage' ? 
                grossRevenue * ((taxRates.buyersClubFee || 0) / 100) : (taxRates.buyersClubFee || 0);
            const vendorSurcharge = rateTypes.vendorSurcharge === 'percentage' ? 
                grossRevenue * ((taxRates.vendorSurcharge || 0) / 100) : (taxRates.vendorSurcharge || 0);
            const miscCharges = rateTypes.miscCharges === 'percentage' ? 
                grossRevenue * ((taxRates.miscCharges || 0) / 100) : (taxRates.miscCharges || 0);
            const oceanFreight = rateTypes.oceanFreight === 'percentage' ? 
                grossRevenue * ((taxRates.oceanFreight || 0) / 100) : (taxRates.oceanFreight || 0);
            const usInlandFreight = rateTypes.usInlandFreight === 'percentage' ? 
                grossRevenue * ((taxRates.usInlandFreight || 0) / 100) : (taxRates.usInlandFreight || 0);
            const profitMarkup = rateTypes.profitMarkup === 'percentage' ? 
                grossRevenue * ((taxRates.profitMarkup || 0) / 100) : (taxRates.profitMarkup || 0);
                
            const operatingExpenses = rateTypes.operatingExpenseRate === 'percentage' ? 
                grossRevenue * ((taxRates.operatingExpenseRate || 0) / 100) : (taxRates.operatingExpenseRate || 0);
            const lossesAndReturns = rateTypes.lossRate === 'percentage' ? 
                grossRevenue * ((taxRates.lossRate || 0) / 100) : (taxRates.lossRate || 0);
            
            const totalTaxes = usTax + bahamasTax + usCustoms + bahamasCustoms + bahamasEnvironmentalDuty;
            const totalFees = warehouseFeeOverall + warehouseReceiverFee + brokerFees + buyersClubFee + 
                            vendorSurcharge + miscCharges;
            const totalFreight = oceanFreight + usInlandFreight;
            // Calculate TOTAL expenses for proper revenue after losses
            const totalAllExpenses = totalTaxes + totalFees + totalFreight + operatingExpenses + lossesAndReturns;
            const revenueAfterLosses = grossRevenue - totalAllExpenses;
            const finalNetProfit = grossRevenue - costOfGoods - totalTaxes - totalFees - totalFreight - operatingExpenses - lossesAndReturns;
            
            return {
                usTax, bahamasTax, usCustoms, bahamasCustoms, bahamasEnvironmentalDuty,
                warehouseFeeOverall, warehouseReceiverFee, brokerFees, buyersClubFee,
                vendorSurcharge, miscCharges, oceanFreight, usInlandFreight, profitMarkup,
                operatingExpenses, lossesAndReturns, totalTaxes, totalFees, totalFreight,
                revenueAfterLosses, finalNetProfit
            };
        }

        function createProductCards(products) {
            const productGrid = document.getElementById('productGrid');
            
            if (!products || products.length === 0) {
                productGrid.innerHTML = '<div style="text-align: center; color: #64748b; padding: 40px;">No products found</div>';
                return;
            }
            
            // Update allProducts if this is the main product data (not filtered)
            if (!allProducts.length || products.length >= allProducts.length) {
                allProducts = products;
            }
            
            productGrid.innerHTML = '';
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                const suggestedPrice = calculateSuggestedPrice(product);
                const priceMatches = checkPriceMatch(product);
                
                // Calculate metrics using product-specific rates
                const metrics = calculateProductMetrics(product);
                const productRateData = getProductRates(product.id);
                const rates = productRateData.rates;
                const types = productRateData.types;
                
                const revenue = product.revenue || 0;
                const netProfit = (product.grossProfit || 0);

        function toggleMetrics(productId) {
            const metricsDiv = document.getElementById(`detailed-${productId}`);
            const toggleBtn = document.getElementById(`toggle-${productId}`);
            
            if (metricsDiv.style.display === 'none') {
                metricsDiv.style.display = 'block';
                toggleBtn.textContent = '📊 Show Less Metrics';
                toggleBtn.classList.add('expanded');
            } else {
                metricsDiv.style.display = 'none';
                toggleBtn.textContent = '📊 Show More Metrics';
                toggleBtn.classList.remove('expanded');
            }
        }
        
        function calculateSuggestedPrice(product) {
            const cost = Number(product.cost || 0);
            
            if (cost <= 0) {
                return Number(product.price || 0);
            }
            
            // Get product-specific profit markup
            const productRateData = getProductRates(product.id);
            const rates = productRateData.rates;
            const types = productRateData.types;
            
            const profitMarkup = rates.profitMarkup || 0;
            const markupType = types.profitMarkup || 'percentage';
            
            let suggestedPrice;
            
            if (markupType === 'percentage') {
                // Apply percentage markup: cost * (1 + markup/100)
                suggestedPrice = cost * (1 + (profitMarkup / 100));
            } else {
                // Apply fixed dollar markup: cost + markup
                suggestedPrice = cost + profitMarkup;
            }
            
            // Ensure minimum price is at least the cost
            return Math.max(suggestedPrice, cost);
        }
        
        function checkPriceMatch(product) {
            const suggestedPrice = calculateSuggestedPrice(product);
            const currentPrice = Number(product.price || 0);
            return Math.abs(suggestedPrice - currentPrice) <= 5.00; // Within $5 tolerance
        }
        
        async function updateShopifyPrice(productId) {
            const updateBtn = document.getElementById(`update-price-${productId}`);
            const shop = getShopDomain();
            
            if (!updateBtn || !productsData || !productsData.products) {
                            showNotification('Error: Product data not available', 'error');
            return;
        }
        
        const product = productsData.products.find(p => String(p.id) === String(productId));
        if (!product) {
            showNotification('Product not found', 'error');
                return;
            }
            
            const suggestedPrice = calculateSuggestedPrice(product);
            
            try {
                updateBtn.disabled = true;
                updateBtn.textContent = '🔄 Updating...';
                updateBtn.classList.add('updating');
                
                console.log('Updating price for product:', productId, 'to:', suggestedPrice);
                console.log('API URL:', `${API_BASE_URL}/api/products/${productId}/price?shop=${shop}`);
                
                const response = await fetch(`${API_BASE_URL}/api/products/${productId}/price?shop=${shop}`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ price: suggestedPrice.toFixed(2) })
                });
                
                let result;
                try {
                    result = await response.json();
                } catch (parseError) {
                    console.error('Failed to parse response:', parseError);
                    result = { error: 'Invalid response from server' };
                }
                
                if (response.ok && result.success) {
                    updateBtn.textContent = '✅ Updated!';
                    updateBtn.classList.remove('updating');
                    updateBtn.classList.add('success');
                    
                    // Update local data
                    product.price = suggestedPrice;

                if (product) {
                    const parsedValue = parseFloat(newValue);
                    product[field] = parsedValue;
                    console.log(`💾 Updated product ${productId} ${field} to:`, parsedValue);
                    
                    // Update display element if it exists
                    const displayElement = document.getElementById(`${field}-${productId}`);
                    if (displayElement) {

                    // Recalculate metrics for this product
                    if (field === 'price' || field === 'cost') {
                        const revenue = (product.sold || 0) * (product.price || 0);
                        const grossProfit = revenue - ((product.sold || 0) * (product.cost || 0));
                        product.revenue = revenue;
                        product.grossProfit = grossProfit;

                return false;

                    return;

                let restoredCount = 0;
                
                productsData.products.forEach(product => {

                    if (savedProductSettings) {
                        // Restore the saved rates and types for this product
                        const productRatesKey = `productRates_${product.id}`;

                        localStorage.setItem(productRatesKey, JSON.stringify(savedProductSettings.rates));

                        console.log('🔄 Resetting all product rates to 0...');
                        
                        if (!productsData || !productsData.products) {
                            showNotification('No products found. Please load product data first.', 'error');

                        }
                        
                        let resetCount = 0;
                        
                        // Reset rates for all products
                        productsData.products.forEach(product => {
                            const productRatesKey = `productRates_${product.id}`;
                            const productTypesKey = `productTypes_${product.id}`;
                            
                            // Set all rates to 0
                            const zeroRates = {
                                usTax: 0,
                                bahamasTax: 0,
                                customsRate: 0,
                                bahamasCustoms: 0,
                                warehouseFeeRate: 0,
                                operatingExpenseRate: 0,
                                lossRate: 0,
                                bahamasEnvironmentalDuty: 0,
                                brokerFees: 0,
                                warehouseReceiverFee: 0,
                                buyersClubFee: 0,
                                vendorSurcharge: 0,
                                miscCharges: 0,
                                profitMarkup: 0,
                                oceanFreight: 0,
                                usInlandFreight: 0
                            };
                            
                            // Keep default types
                            const defaultTypes = {
                                usTax: 'percentage',
                                bahamasTax: 'percentage',
                                customsRate: 'percentage',
                                bahamasCustoms: 'percentage',
                                warehouseFeeRate: 'percentage',
                                operatingExpenseRate: 'percentage',
                                lossRate: 'percentage',
                                bahamasEnvironmentalDuty: 'percentage',
                                brokerFees: 'dollar',
                                warehouseReceiverFee: 'dollar',
                                buyersClubFee: 'percentage',
                                vendorSurcharge: 'percentage',
                                miscCharges: 'dollar',
                                profitMarkup: 'percentage',
                                oceanFreight: 'dollar',
                                usInlandFreight: 'dollar'
                            };
                            
                            localStorage.setItem(productRatesKey, JSON.stringify(zeroRates));
                            localStorage.setItem(productTypesKey, JSON.stringify(defaultTypes));
                            resetCount++;
                        });
                        
                        console.log(`✅ Reset rates for ${resetCount} products`);
                        
                        // Refresh all data to show the changes
                        refreshAllData();
                        
                        // Show success message
                        setTimeout(() => {
                            showNotification(`Successfully reset all rates to 0 for ${resetCount} products! All calculations have been updated.`, 'success');
                        }, 500);
                        
                    } catch (error) {
                        console.error('❌ Error resetting product rates:', error);
                        showNotification(`Error resetting product rates: ${error.message}`, 'error');
                    }
                },
                () => {
                    console.log('❌ Reset cancelled by user');
                }
            );
        }
        
        function saveProductRates(productId, rates, types) {
            try {
                if (!productId) {
                    throw new Error('Product ID is required');
                }
                
                if (!rates || typeof rates !== 'object') {
                    throw new Error('Valid rates object is required');
                }
                
                if (!types || typeof types !== 'object') {
                    throw new Error('Valid types object is required');
                }
                
                const productRatesKey = `productRates_${productId}`;
                const productTypesKey = `productTypes_${productId}`;
                
                // Validate localStorage is available
                if (typeof localStorage === 'undefined') {
                    throw new Error('LocalStorage is not available');
                }
                
                localStorage.setItem(productRatesKey, JSON.stringify(rates));
                localStorage.setItem(productTypesKey, JSON.stringify(types));
                
                console.log(`✅ Rates saved for product ${productId}:`, rates);
                console.log(`✅ Types saved for product ${productId}:`, types);
                
                // Verify the data was saved correctly
                const savedRates = JSON.parse(localStorage.getItem(productRatesKey));
                const savedTypes = JSON.parse(localStorage.getItem(productTypesKey));
                
                if (!savedRates || !savedTypes) {
                    throw new Error('Failed to verify saved data in localStorage');
                }
                
                return true;
            } catch (error) {
                console.error('❌ Error saving product rates:', error);
                showNotification(`Error saving product rates: ${error.message}`, 'error');
                return false;
            }
        }
        
        function calculateProductMetrics(product) {
            const productRateData = getProductRates(product.id);
            const rates = productRateData.rates;
            const types = productRateData.types;
            
            const revenue = product.revenue || 0;
            
            // Calculate using product-specific rates
            const usTaxAmount = types.usTax === 'percentage' ? 
                revenue * (rates.usTax / 100) : rates.usTax;
            const bahamasTaxAmount = types.bahamasTax === 'percentage' ? 
                revenue * (rates.bahamasTax / 100) : rates.bahamasTax;
            const usCustoms = types.customsRate === 'percentage' ? 
                revenue * (rates.customsRate / 100) : rates.customsRate;
            const bahamasCustoms = types.bahamasCustoms === 'percentage' ? 
                revenue * (rates.bahamasCustoms / 100) : rates.bahamasCustoms;
            const bahamasEnvironmentalDuty = types.bahamasEnvironmentalDuty === 'percentage' ? 
                revenue * (rates.bahamasEnvironmentalDuty / 100) : rates.bahamasEnvironmentalDuty;
            const warehouseFee = types.warehouseFeeRate === 'percentage' ? 
                revenue * (rates.warehouseFeeRate / 100) : rates.warehouseFeeRate;
            const warehouseReceiverFee = types.warehouseReceiverFee === 'percentage' ? 
                revenue * (rates.warehouseReceiverFee / 100) : rates.warehouseReceiverFee;
            const brokerFees = types.brokerFees === 'percentage' ? 
                revenue * (rates.brokerFees / 100) : rates.brokerFees;
            const buyersClubFee = types.buyersClubFee === 'percentage' ? 
                revenue * (rates.buyersClubFee / 100) : rates.buyersClubFee;
            const vendorSurcharge = types.vendorSurcharge === 'percentage' ? 
                revenue * (rates.vendorSurcharge / 100) : rates.vendorSurcharge;
            const miscCharges = types.miscCharges === 'percentage' ? 
                revenue * (rates.miscCharges / 100) : rates.miscCharges;
            const oceanFreight = types.oceanFreight === 'percentage' ? 
                revenue * (rates.oceanFreight / 100) : rates.oceanFreight;
            const usInlandFreight = types.usInlandFreight === 'percentage' ? 
                revenue * (rates.usInlandFreight / 100) : rates.usInlandFreight;
            const operatingExpenses = types.operatingExpenseRate === 'percentage' ? 
                revenue * (rates.operatingExpenseRate / 100) : rates.operatingExpenseRate;
                
            return {
                usTaxAmount, bahamasTaxAmount, usCustoms, bahamasCustoms, bahamasEnvironmentalDuty,
                warehouseFee, warehouseReceiverFee, brokerFees, buyersClubFee,
                vendorSurcharge, miscCharges, oceanFreight, usInlandFreight, operatingExpenses,
                totalTaxes: usTaxAmount + bahamasTaxAmount,
                totalDuties: usCustoms + bahamasCustoms + bahamasEnvironmentalDuty,
                totalFees: warehouseFee + warehouseReceiverFee + brokerFees + buyersClubFee + vendorSurcharge + miscCharges,
                totalFreight: oceanFreight + usInlandFreight,
                totalExpenses: usTaxAmount + bahamasTaxAmount + usCustoms + bahamasCustoms + bahamasEnvironmentalDuty + warehouseFee + warehouseReceiverFee + brokerFees + buyersClubFee + vendorSurcharge + miscCharges + oceanFreight + usInlandFreight + operatingExpenses
            };
        }
        
        function calculateOverallMetricsFromProducts() {
            if (!productsData || !productsData.products) return null;
            
            let totalUsTax = 0, totalBahamasTax = 0, totalCustoms = 0, totalBahamasCustoms = 0, totalEnvironmental = 0;
            let totalWarehouse = 0, totalReceiver = 0, totalBroker = 0, totalBuyers = 0;
            let totalVendor = 0, totalMisc = 0, totalOcean = 0, totalInland = 0, totalOperating = 0;
            
            // Aggregate all product-specific calculations
            productsData.products.forEach(product => {
                const metrics = calculateProductMetrics(product);
                totalUsTax += metrics.usTaxAmount;
                totalBahamasTax += metrics.bahamasTaxAmount;
                totalCustoms += metrics.usCustoms;
                totalBahamasCustoms += metrics.bahamasCustoms;
                totalEnvironmental += metrics.bahamasEnvironmentalDuty;
                totalWarehouse += metrics.warehouseFee;
                totalReceiver += metrics.warehouseReceiverFee;
                totalBroker += metrics.brokerFees;
                totalBuyers += metrics.buyersClubFee;
                totalVendor += metrics.vendorSurcharge;
                totalMisc += metrics.miscCharges;
                totalOcean += metrics.oceanFreight;
                totalInland += metrics.usInlandFreight;
                totalOperating += metrics.operatingExpenses;
            });
            
            const totalTaxes = totalUsTax + totalBahamasTax + totalCustoms + totalBahamasCustoms + totalEnvironmental;
            const totalFees = totalWarehouse + totalReceiver + totalBroker + totalBuyers + totalVendor + totalMisc;
            const totalFreight = totalOcean + totalInland;
            const totalExpenses = totalTaxes + totalFees + totalFreight + totalOperating;
            
            const grossRevenue = financialData.data.grossRevenue || 0;
            const costOfGoods = financialData.data.costOfGoods || 0;
            const lossesAndReturns = rateTypes.lossRate === 'percentage' ? 
                grossRevenue * (taxRates.lossRate / 100) : taxRates.lossRate;
            
            return {
                usTax: totalUsTax,
                bahamasTax: totalBahamasTax, 
                usCustoms: totalCustoms,
                bahamasCustoms: totalBahamasCustoms,
                bahamasEnvironmentalDuty: totalEnvironmental,
                warehouseFeeOverall: totalWarehouse,
                warehouseReceiverFee: totalReceiver,
                brokerFees: totalBroker,
                buyersClubFee: totalBuyers,
                vendorSurcharge: totalVendor,
                miscCharges: totalMisc,
                oceanFreight: totalOcean,
                usInlandFreight: totalInland,
                operatingExpenses: totalOperating,
                totalTaxes, totalFees, totalFreight,
                revenueAfterLosses: grossRevenue - totalExpenses - lossesAndReturns,
                finalNetProfit: grossRevenue - costOfGoods - totalExpenses - lossesAndReturns,
                lossesAndReturns
            };
        }

        // Safe currency formatting function - prevents NaN display
        function formatCurrency(value) {
            // Handle null, undefined, NaN, and non-numeric values
            const numValue = Number(value);
            if (isNaN(numValue) || !isFinite(numValue)) {
                return '$0.00';
            }
            return '$' + numValue.toLocaleString('en-US', {minimumFractionDigits: 2});
        }
        
        // Safe number formatting function  
        function formatNumber(value) {
            const numValue = Number(value);
            if (isNaN(numValue) || !isFinite(numValue)) {
                return '0';
            }
            return numValue.toLocaleString('en-US');
        }

        function showProfitMarkupEditModal(productId, product) {
            const productRateData = getProductRates(productId);
            const rates = productRateData.rates;
            const types = productRateData.types;
            
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.7); z-index: 1000;
                display: flex; align-items: center; justify-content: center;
            `;
            
            modal.innerHTML = `
                <div style="
                    background: white; padding: 24px; border-radius: 12px; 
                    max-width: 500px; width: 90%;
                ">
                    <h3 style="margin-bottom: 16px; color: #1e293b;">💎 Edit Profit Markup for ${product.title}</h3>
                    <div style="margin-bottom: 16px; padding: 12px; background: #f1f5f9; border-radius: 8px;">
                        <p style="margin: 0; font-size: 14px; color: #64748b;">
                            💡 This profit markup will be used to calculate the suggested price for this specific product.
                            Set it to 0 to use cost-only pricing, or set a percentage to add profit margin.
                        </p>
                    </div>
                    <div style="margin-bottom: 16px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Profit Markup Value:</label>
                        <input type="number" id="profit-markup-value" value="${rates.profitMarkup}" step="0.1" min="0" style="
                            width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px;
                            font-size: 16px;
                        " placeholder="Enter markup percentage (e.g., 50 for 50%)">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Markup Type:</label>
                        <select id="profit-markup-type" style="
                            width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px;
                            font-size: 16px;
                        ">
                            <option value="percentage" ${types.profitMarkup === 'percentage' ? 'selected' : ''}>Percentage (%)</option>
                            <option value="dollar" ${types.profitMarkup === 'dollar' ? 'selected' : ''}>Fixed Amount ($)</option>
                        </select>
                    </div>
                    <div style="margin-bottom: 20px; padding: 12px; background: #e0f2fe; border-radius: 8px; border-left: 4px solid #0284c7;">
                        <div style="font-size: 14px; font-weight: 600; margin-bottom: 4px;">Current Cost: $${Number(product.cost || 0).toFixed(2)}</div>
                        <div style="font-size: 14px;" id="markup-preview">
                            Preview: With ${rates.profitMarkup}% markup = $${(Number(product.cost || 0) * (1 + (rates.profitMarkup / 100))).toFixed(2)}
                        </div>
                    </div>
                    <div style="display: flex; gap: 12px; justify-content: flex-end;">
                        <button onclick="this.parentElement.parentElement.parentElement.remove()" style="
                            padding: 12px 20px; border: 1px solid #d1d5db; 
                            background: white; border-radius: 6px; cursor: pointer;
                            font-weight: 600;
                        ">Cancel</button>
                        <button onclick="saveProfitMarkup('${productId}'); this.parentElement.parentElement.parentElement.remove();" style="
                            padding: 12px 20px; background: #10b981; color: white; 
                            border: none; border-radius: 6px; cursor: pointer;
                            font-weight: 600;
                        ">💾 Save Markup</button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            // Add live preview functionality
            const markupInput = modal.querySelector('#profit-markup-value');
            const markupType = modal.querySelector('#profit-markup-type');
            const preview = modal.querySelector('#markup-preview');
            const cost = Number(product.cost || 0);
            
            function updatePreview() {
                const markup = Number(markupInput.value) || 0;
                const type = markupType.value;
                let suggestedPrice;
                
                if (type === 'percentage') {
                    suggestedPrice = cost * (1 + (markup / 100));
                    preview.textContent = `Preview: With ${markup}% markup = $${suggestedPrice.toFixed(2)}`;
                } else {
                    suggestedPrice = cost + markup;
                    preview.textContent = `Preview: Cost + $${markup} = $${suggestedPrice.toFixed(2)}`;
                }
            }
            
            markupInput.addEventListener('input', updatePreview);
            markupType.addEventListener('change', updatePreview);
        }
        
        function saveProfitMarkup(productId) {
            try {
                const markupValue = parseFloat(document.getElementById('profit-markup-value').value) || 0;
                const markupType = document.getElementById('profit-markup-type').value;
                
                console.log(`💾 Updating profit markup for product ${productId}: ${markupValue} (${markupType})`);
                
                // Get current product rates and update profit markup
                const productRateData = getProductRates(productId);
                const rates = productRateData.rates;
                const types = productRateData.types;
                
                rates.profitMarkup = markupValue;
                types.profitMarkup = markupType;
                
                // Save the updated rates
                if (saveProductRates(productId, rates, types)) {
                    console.log(`✅ Profit markup updated for product ${productId}`);
                    
                    // Refresh all data to show changes including suggested price
                    setTimeout(() => {
                        refreshAllData();
                        showNotification(`Profit markup updated to ${markupValue}${markupType === 'percentage' ? '%' : '$'} for this product! Suggested price will now reflect this markup.`, 'success');
                    }, 500);
                }
            } catch (error) {
                console.error('❌ Error saving profit markup:', error);
                showNotification(`Error saving profit markup: ${error.message}`, 'error');
            }
        }

        function toggleMetricsWithEdit(productId) {
            const metricsDiv = document.getElementById(`detailed-${productId}`);
            const toggleBtn = document.getElementById(`toggle-${productId}`);
            
            if (metricsDiv.style.display === 'none') {
                metricsDiv.style.display = 'block';
                toggleBtn.textContent = '📊 Show Less Metrics & Edit';
                toggleBtn.classList.add('expanded');
            } else {
                metricsDiv.style.display = 'none';
                toggleBtn.textContent = '📊 Show More Metrics & Edit';
                toggleBtn.classList.remove('expanded');
            }
        }
        
        function updateProductRate(productId, rateKey, value, type) {
            try {
                const productRateData = getProductRates(productId);
                const rates = productRateData.rates;
                const types = productRateData.types;
                
                // Update the specific rate and type
                rates[rateKey] = parseFloat(value) || 0;
                types[rateKey] = type;
                
                // Save the updated rates
                saveProductRates(productId, rates, types);
                
                // Recalculate metrics for this product
                const product = productsData.products.find(p => String(p.id) === String(productId));
                if (product) {
                    const metrics = calculateProductMetrics(product);
                    
                    // Update the calculated value display for this specific metric
                    const calculatedValueSpan = document.querySelector(`#detailed-${productId} .product-metric .metric-with-inputs .metric-calculated-value`);
                    
                    // Find the correct calculated value span for this rate
                    const metricRows = document.querySelectorAll(`#detailed-${productId} .product-metric`);
                    metricRows.forEach(row => {
                        const input = row.querySelector(`input[onchange*="${rateKey}"]`);
                        if (input) {
                            const calculatedSpan = row.querySelector('.metric-calculated-value');
                            if (calculatedSpan) {
                                // Update with the new calculated value
                                let calculatedValue = 0;
                                switch(rateKey) {
                                    case 'usTax': calculatedValue = metrics.usTaxAmount || 0; break;
                                    case 'bahamasTax': calculatedValue = metrics.bahamasTaxAmount || 0; break;
                                    case 'customsRate': calculatedValue = metrics.usCustoms || 0; break;
                                    case 'bahamasCustoms': calculatedValue = metrics.bahamasCustoms || 0; break;
                                    case 'bahamasEnvironmentalDuty': calculatedValue = metrics.bahamasEnvironmentalDuty || 0; break;
                                    case 'warehouseFeeRate': calculatedValue = metrics.warehouseFee || 0; break;
                                    case 'warehouseReceiverFee': calculatedValue = metrics.warehouseReceiverFee || 0; break;
                                    case 'brokerFees': calculatedValue = metrics.brokerFees || 0; break;
                                    case 'buyersClubFee': calculatedValue = metrics.buyersClubFee || 0; break;
                                    case 'vendorSurcharge': calculatedValue = metrics.vendorSurcharge || 0; break;
                                    case 'miscCharges': calculatedValue = metrics.miscCharges || 0; break;
                                    case 'oceanFreight': calculatedValue = metrics.oceanFreight || 0; break;
                                    case 'usInlandFreight': calculatedValue = metrics.usInlandFreight || 0; break;
                                    case 'profitMarkup': 
                                        calculatedSpan.textContent = (parseFloat(value) || 0) + (type === 'percentage' ? '%' : '$');
                                        return;
                                }
                                
                                if (rateKey !== 'profitMarkup') {
                                    // Use safe number formatting
                                    const safeValue = Number(calculatedValue);
                                    if (isNaN(safeValue) || !isFinite(safeValue)) {
                                        calculatedSpan.textContent = '$0.00';
                                    } else {
                                        calculatedSpan.textContent = '$' + safeValue.toFixed(2);
                                    }
                                }
                            }
                        }
                    });
                    
                    // Update other calculated fields with safe calculations
                    const safeGrossProfit = Number(product.grossProfit) || 0;
                    const safeRevenue = Number(product.revenue) || 0;
                    const safeTotalExpenses = Number(metrics.totalExpenses) || 0;
                    
                    const finalProfit = safeGrossProfit - safeTotalExpenses;
                    const revenueAfterLosses = safeRevenue - safeTotalExpenses;
                    
                    // Update Revenue After Losses display
                    const revenueAfterLossesSpan = document.querySelector(`#detailed-${productId} .product-metric span:contains('Revenue After Losses') + span`);
                    if (revenueAfterLossesSpan) {
                        if (isNaN(revenueAfterLosses) || !isFinite(revenueAfterLosses)) {
                            revenueAfterLossesSpan.textContent = '$0.00';
                        } else {
                            revenueAfterLossesSpan.textContent = '$' + revenueAfterLosses.toFixed(2);
                        }
                    }
                    
                    // Update Final Profit display
                    const finalProfitSpan = document.querySelector(`#detailed-${productId} .product-metric span:contains('Final Profit') + span`);
                    if (finalProfitSpan) {
                        if (isNaN(finalProfit) || !isFinite(finalProfit)) {
                            finalProfitSpan.textContent = '$0.00';
                            finalProfitSpan.style.color = '#64748b';
                        } else {
                            finalProfitSpan.textContent = '$' + finalProfit.toFixed(2);
                            finalProfitSpan.style.color = finalProfit >= 0 ? '#10b981' : '#ef4444';
                        }
                    }
                    
                    // Update suggested price if profit markup changed
                    if (rateKey === 'profitMarkup') {
                        const suggestedPrice = calculateSuggestedPrice(product);
                        const suggestedPriceSpan = document.querySelector(`.product-card .suggested-price-value`);
                        if (suggestedPriceSpan) {
                            const safeSuggestedPrice = Number(suggestedPrice);
                            if (isNaN(safeSuggestedPrice) || !isFinite(safeSuggestedPrice)) {
                                suggestedPriceSpan.textContent = '$0.00';
                            } else {
                                suggestedPriceSpan.textContent = '$' + safeSuggestedPrice.toFixed(2);
                            }
                        }
                    }
                }
                
                // Refresh overall calculations and update dashboard
                setTimeout(() => {
                    refreshAllData();
                    
                    // Force update of overall metrics sections
                    if (typeof updateOverallMetrics === 'function') {
                        updateOverallMetrics();
                    }
                    
                    // Update summary cards if they exist
                    const summaryCards = document.querySelectorAll('.summary-card');
                    if (summaryCards.length > 0) {
                        loadFinancialData();
                    }
                }, 100);
                
                console.log(`✅ Updated ${rateKey} for product ${productId}: ${value}${type === 'percentage' ? '%' : '$'}`);
                
                // Show success notification
                showNotification(`${rateKey.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase())} updated successfully!`, 'success');
                
            } catch (error) {
                console.error('❌ Error updating product rate:', error);
                showNotification(`Error updating ${rateKey}: ${error.message}`, 'error');
            }
        }
    </script>
